apiVersion: apps/v1
kind: Deployment
metadata:
  name: spa-renderer-deployment
  namespace: "{{ k8s_namespace }}"
spec:
  selector:
    matchLabels:
      app: spa-renderer
      branch: "{{ git_branch }}"
  replicas: {{ replica_count }}
  template:
    metadata:
      labels:
        app: spa-renderer
        branch: "{{ git_branch }}"
    spec:
      containers:
        - name: spa-renderer-container
          image: "ghcr.io/ruchira088/video-downloader-spa-renderer:{{ git_branch }}-{{ git_commit }}"
          # Sized for renderingConfiguration.maxConcurrentRenders (4 by default):
          # each Chromium takes roughly 200-300 MiB on top of the Node process.
          # Change these together with MAX_CONCURRENT_RENDERS. There is no CPU
          # limit, so a busy pod is slowed by contention rather than throttled.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              port: expressjs-port
              path: /service/information
              httpHeaders:
                - name: X-Request-ID
                  value: k8s-readiness-probe
          livenessProbe:
            httpGet:
              port: expressjs-port
              path: /service/information
              httpHeaders:
                - name: X-Request-ID
                  value: k8s-liveness-probe
          startupProbe:
            periodSeconds: 5
            failureThreshold: 10
            httpGet:
              port: expressjs-port
              path: /service/information
              httpHeaders:
                - name: X-Request-ID
                  value: k8s-liveness-probe
          ports:
            - name: expressjs-port
              containerPort: 8000
      imagePullSecrets:
        - name: docker-registry-credentials